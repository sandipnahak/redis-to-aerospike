# Copy the keyspace, then keep Aerospike current from keyspace notifications.
#
#   redis2aerospike --config examples/config.sync.yaml
#
# The same run with an event log, when the YAML does not set event_log.
# A relative path is written next to the config file, with a timestamp added
# before .jsonl (redis2aerospike-sync-20261103T160300+0530.jsonl):
#
#   redis2aerospike --config examples/config.sync.yaml \
#     --event-log redis2aerospike-sync.jsonl
#
# sync_catchup subscribes before the scan and replays every key that changes
# during the copy. Leave it false to subscribe only after the scan; that
# window is then dropped.
#
# MemoryDB parameter group notify-keyspace-events:
#   KEA  follow every change after the scan
#   Ex   after the scan, only delete Aerospike records whose Redis key expired
# pubsub_channel: auto selects the matching channel family.

mode: sync
# Append tail changes in receive order. The initial scan is not logged.
# Equivalent to --event-log redis2aerospike-sync.jsonl
event_log: redis2aerospike-sync.jsonl
pubsub_channel: auto
pubsub_refresh_s: 30
# Subscribe first so writes during the scan are not lost. Requires KEA
# (or another value that publishes the commands you need). Ex only replays expiries.
sync_catchup: true

redis:
  host: clustercfg.example.memorydb.amazonaws.com
  port: 6379
  cluster: true
  username: app
  password: null
  ssl: true
  # Limits both the initial SCAN and the notifications that follow.
  scan_match: "*"
  ttl_command: pttl
  # MemoryDB Multi-Region stores expiry inside the value instead of PTTL:
  # ttl_command: dump
  # ttl_dump_field: e

aerospike:
  host: aerospike.example
  port: 3000
  namespace: test
  set_name: redis
  value_bin: value
  record_exists_policy: replace
  set_routes:
    - pattern: "user:*"
      destination: users
    - pattern: "session:*"
      destination: sessions

workers: 8
scan_batch: 500
queue_size: 10000
# Throttle the initial copy. The same write limit applies to the tail.
scan_rate_limit: 5000
write_rate_limit: 2000
# Used by the scan only. The tail writes one record at a time.
write_batch_size: 100
hash_strategy: map_bin
ttl_overflow_policy: reject
progress_interval: 10
