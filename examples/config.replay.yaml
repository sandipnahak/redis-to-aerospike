# Write an event log into Aerospike, in file order. Redis is not contacted.
#
#   redis2aerospike --config examples/config.replay.yaml \
#     --event-log redis2aerospike-sync-20261103T160300+0530.jsonl \
#     --from-seq 120
#
# Pass the file written by pubsub or sync. The filename timestamp and the
# time field on each line are for tracking. Replay follows seq. --from-seq
# applies that sequence and every line after it. Omit it to apply the whole file.
# Preview without writing:
#   redis2aerospike --config examples/config.replay.yaml --dry-run \
#     --event-log redis2aerospike-sync-20261103T160300+0530.jsonl --from-seq 120

mode: replay
event_log: redis2aerospike-sync-20261103T160300+0530.jsonl
# from_seq: 120

aerospike:
  host: aerospike.example
  port: 3000
  namespace: test
  set_name: redis
  value_bin: value
  record_exists_policy: replace
  set_routes:
    - pattern: "user:*"
      destination: users
    - pattern: "session:*"
      destination: sessions

workers: 1
write_rate_limit: 2000
ttl_overflow_policy: reject
progress_interval: 10
